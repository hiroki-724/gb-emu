[package]
name = "gb-web"
description = "ブラウザ用フロントエンド（WebAssembly）"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gb-core = { path = "../core" }
wasm-bindgen = "0.2"

# wasm-opt（binaryen）は別途ダウンロードが必要になるので使わない。
# 速度は rustc の最適化（opt-level 3 + LTO）だけで十分出ている
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
